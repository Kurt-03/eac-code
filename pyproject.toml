[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eaccode"
version = "0.1.0"
description = "An autonomous coding agent CLI (Claude Code / Hermes-style, BYOK)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kurtj" }]
dependencies = [
  "pydantic>=2.13",
  "click>=8.1",
  "platformdirs>=4.0",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]
llm = [
  "litellm>=1.95",
  "tenacity>=9.0",
  "tiktoken>=0.8",
]
ui = [
  "textual>=8.0",
  "rich>=15.0",
]
mcp = [
  "mcp>=2.0",
]
all = ["eaccode[dev,llm,ui,mcp]"]

[project.scripts]
eaccode = "eaccode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eaccode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: live network calls — skipped by default (pytest -m integration)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
