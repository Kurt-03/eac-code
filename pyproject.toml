[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eaccode"
version = "0.0.1"
description = "An autonomous coding agent CLI (Claude Code / Hermes-style, BYOK)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kurtj" }]
dependencies = [
  "pydantic>=2.13",
  "click>=8.1",
  "platformdirs>=4.0",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "websocket-client>=1.8",
  # v0.7.2: classic REPL uses prompt_toolkit for cross-platform
  # input editing + history (Windows has no `readline`).
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]
llm = [
  "litellm>=1.95",
  "tenacity>=9.0",
  "tiktoken>=0.8",
]
# v0.7.2: TUI group is gone. `ui` is kept as a no-op alias for the
# CLI install command (`pip install -e ".[all]"`) — removing it would
# break existing scripts.
ui = []
mcp = [
  "mcp>=2.0",
]
all = ["eaccode[dev,llm,ui,mcp]"]

[project.scripts]
eaccode = "eaccode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eaccode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: live network calls — skipped by default (pytest -m integration)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# TUI markers: › ▸ ⠋ ─ ✗ ‖ — they're intentional, not ambiguous.
"src/eaccode/tui/*.py" = ["RUF001", "RUF002"]
# The repl hosts the same flat-TUI markers.
"src/eaccode/ui/repl.py" = ["RUF001", "RUF002", "SIM105"]
# String-golden tests assert exact TUI markers.
"tests/unit/test_tui_*.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
