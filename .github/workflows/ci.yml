name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install
        # F1 (audit): [dev] alone lacks llm/ui/mcp extras — 13 test
        # modules failed to even collect on CI.
        run: |
          pip install -e ".[all]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src || true
      - name: Test
        run: pytest tests/unit -q
